<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chami Chel</title>
<style>
:root{--bg:#f4efe6;--fg:#2a1a1a;--accent:#7a1f2b;--gold:#e0b030;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1214;--fg:#f4e9e0;--accent:#c4475a}}
:root[data-theme="dark"]{--bg:#1a1214;--fg:#f4e9e0;--accent:#c4475a}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:10px;min-height:100vh}
h1{margin:4px 0;font-size:1.5rem;color:var(--accent);letter-spacing:.04em}
a{color:var(--accent)}
.sub{margin:0 0 8px;font-size:.85rem;opacity:.8;text-align:center}
.wrap{position:relative;width:100%;max-width:820px}
canvas{width:100%;height:auto;display:block;border-radius:14px;border:4px solid var(--accent);touch-action:none;background:#eef6fb}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(40,10,15,.85);color:#fff;border-radius:10px;text-align:center;padding:20px}
.ov h2{margin:0;color:var(--gold);font-size:1.7rem}
.ov p{margin:0;font-size:.95rem;max-width:460px}
button{font:inherit;font-weight:700;padding:10px 24px;border:0;border-radius:999px;background:var(--gold);color:#3a1a00;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.pad{display:flex;gap:16px;margin-top:10px}
.pad button{padding:16px 34px;font-size:1.05rem}
.hidden{display:none}
</style>
</head>
<body>
<h1>CHAMI CHEL</h1>
<p class="sub">3-on-3 hockey &middot; Students vs. The Faculty &middot; <a href="index.html">All Chami games</a></p>
<div class="wrap">
<canvas id="c" width="800" height="440"></canvas>
<div class="ov" id="ov">
<h2 id="ovT">Chami Chel</h2>
<p id="ovP">Move: WASD / arrows (or drag on the left side on a phone).<br>Hold SPACE to charge a shot, release to fire. Press E to pass. 90 seconds, sudden-death overtime if tied.</p>
<button id="go">Face Off</button>
</div>
</div>
<div class="pad"><button id="bs">SHOOT</button><button id="bp">PASS</button></div>
<script>
const W=800,H=440,GY=220,GH=58,cv=document.getElementById('c'),g=cv.getContext('2d'),$=id=>document.getElementById(id);
let P,puck,car,ctl,score=[0,0],clock=90,pause=0,pend=false,msg='',ot=false,play=false,keys={},tv=[0,0],charge=0,hold=false,org=null;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const mk=(t,x,y,gl)=>({t,x,y,vx:0,vy:0,f:t?Math.PI:0,gl,cd:0,ai:50});
function setup(){P=[mk(0,45,GY,1),mk(0,300,150),mk(0,300,290),mk(1,W-45,GY,1),mk(1,500,150),mk(1,500,290)];puck={x:W/2,y:GY,vx:0,vy:0};car=null;ctl=P[1];hold=false;charge=0}
function shoot(p,sp,a=p.f){puck.x=p.x+Math.cos(a)*18;puck.y=p.y+Math.sin(a)*18;puck.vx=Math.cos(a)*sp;puck.vy=Math.sin(a)*sp;car=null;p.cd=25;p.f=a}
function pass(p){let b=null,bs=-1e9;for(const q of P){if(q.t!==p.t||q.gl||q===p)continue;const a=Math.atan2(q.y-p.y,q.x-p.x),s=p===ctl?Math.cos(a-p.f)*100-dist(p,q)*.05:-dist(p,q);if(s>bs){bs=s;b=q}}if(b)shoot(p,9,Math.atan2(b.y+b.vy*8-p.y,b.x+b.vx*8-p.x))}
function press(){hold=true;charge=0}
function release(){if(hold&&car===ctl){let a=ctl.f;const d=Math.atan2(GY-ctl.y,W-ctl.x);let df=Math.atan2(Math.sin(d-a),Math.cos(d-a));if(Math.abs(df)<1.1)a+=df*.85;shoot(ctl,10+Math.min(charge,1)*6,a)}hold=false;charge=0}
function doPass(){if(car===ctl)pass(ctl)}
const tw=(p,tx,ty)=>{const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);return d<6?[0,0]:[dx/d,dy/d]};
function ai(p){const dir=p.t?-1:1,gx=p.t?0:W,own=p.t?W:0;
 if(car===p){p.ai--;const d=Math.hypot(gx-p.x,GY-p.y);
  if(p.ai<=0&&d<240){shoot(p,9,Math.atan2(GY+(Math.random()-.5)*70-p.y,gx-p.x)+(Math.random()-.5)*.45);p.ai=60;return[0,0]}
  if(p.ai<=0&&P.some(o=>o.t!==p.t&&!o.gl&&dist(o,p)<40)){pass(p);p.ai=40;return[0,0]}
  return tw(p,gx,GY)}
 if(car&&car.t===p.t)return tw(p,cl(car.x+dir*110,60,W-60),H-car.y);
 let b=null,bd=1e9;for(const q of P)if(q.t===p.t&&!q.gl){const d=dist(q,puck);if(d<bd){bd=d;b=q}}
 if(b===p)return tw(p,puck.x,puck.y);
 return tw(p,puck.x*.6+own*.4,GY)}
function goal(w){score[w]++;msg=w?'GOAL \u2014 FACULTY!':'GOAL \u2014 STUDENTS!';if(ot){end();return}pause=100;pend=true}
function end(){play=false;const a=score[0],b=score[1];$('ovT').textContent=a>b?'Students win! \ud83c\udfd2':'The Faculty wins!';$('ovP').textContent='Final: Students '+a+', Faculty '+b+(a>b?'. Chami pride!':'. Rematch?');$('go').textContent='Play Again';$('ov').classList.remove('hidden')}
function step(){
 if(pause>0){if(--pause===0&&pend){pend=false;setup()}return}
 clock-=1/60;if(clock<=0){clock=0;if(score[0]!==score[1]){end();return}ot=true}
 if(car&&car.t===0&&!car.gl)ctl=car;else{let b=null,bd=1e9;for(const p of P)if(p.t===0&&!p.gl){const d=dist(p,puck);if(d<bd){bd=d;b=p}}if(b!==ctl&&bd<dist(ctl,puck)-30)ctl=b}
 let ix=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+tv[0],iy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+tv[1];
 const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
 if(hold)charge+=.025;
 for(const p of P){p.cd--;
  if(p.gl){const hx=p.t?W-45:45;p.x=hx;const gs=p.t?1.7:3,gr=p.t?26:38;p.y=cl(p.y+cl(puck.y-p.y,-gs,gs),GY-gr,GY+gr);continue}
  const [ax,ay]=p===ctl?[ix,iy]:ai(p),mx=p.t?2.4:3.6;
  p.vx=p.vx*.88+ax*.5;p.vy=p.vy*.88+ay*.5;const s=Math.hypot(p.vx,p.vy);if(s>mx){p.vx*=mx/s;p.vy*=mx/s}
  if(Math.hypot(ax,ay)>.1)p.f=Math.atan2(ay,ax);
  p.x=cl(p.x+p.vx,14,W-14);p.y=cl(p.y+p.vy,14,H-14)}
 for(const p of P)if(!p.gl)for(const q of P)if(q.gl){const dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;if(d<36){p.x=q.x+dx/d*36;p.y=q.y+dy/d*36;p.vx*=.5;p.vy*=.5}}
 if(car){puck.x=car.x+Math.cos(car.f)*16;puck.y=car.y+Math.sin(car.f)*16;puck.vx=puck.vy=0;
  for(const p of P)if(!p.gl&&p.t!==car.t&&p.cd<=0&&dist(p,car)<20&&Math.random()<(car.t===0?.012:.05)){car.cd=40;car=p;break}}
 else{
  puck.x+=puck.vx;puck.y+=puck.vy;puck.vx*=.988;puck.vy*=.988;
  const sp=Math.hypot(puck.vx,puck.vy);
  for(const p of P){const d=dist(p,puck),r=p.gl?(p.t?12:18):13;if(d>=r+5)continue;
   const nx=(puck.x-p.x)/(d||1),ny=(puck.y-p.y)/(d||1);
   if(!p.gl&&p.cd<=0&&sp<11){car=p;puck.vx=puck.vy=0;break}
   const vn=puck.vx*nx+puck.vy*ny;if(vn<0){puck.vx-=1.7*vn*nx;puck.vy-=1.7*vn*ny}
   if(p.gl&&Math.hypot(puck.vx,puck.vy)<2.5){puck.vx+=nx*3;puck.vy+=ny*3}
   puck.x=p.x+nx*(r+6);puck.y=p.y+ny*(r+6)}
  if(!car){
   if(Math.abs(puck.y-GY)<GH){if(puck.x<16){goal(1);return}if(puck.x>W-16){goal(0);return}}
   if(puck.x<10){puck.x=10;puck.vx=Math.abs(puck.vx)*.9}
   if(puck.x>W-10){puck.x=W-10;puck.vx=-Math.abs(puck.vx)*.9}
   if(puck.y<8){puck.y=8;puck.vy=Math.abs(puck.vy)*.9}
   if(puck.y>H-8){puck.y=H-8;puck.vy=-Math.abs(puck.vy)*.9}}}
}
function icon(p){
 const S=p.t===0,jc=S?'#7a1f2b':'#3a3a3a',ac=S?'#e0b030':'#cfcfcf',hc=S?'#4a0f18':'#111';
 g.save();g.translate(p.x,p.y);g.rotate(p.f);g.lineCap='round';
 if(p.gl){
  g.fillStyle='#fff';g.strokeStyle=jc;g.lineWidth=2;
  g.fillRect(2,-17,13,10);g.strokeRect(2,-17,13,10);g.fillRect(2,7,13,10);g.strokeRect(2,7,13,10);
  g.fillStyle=jc;g.beginPath();g.ellipse(-2,0,9,15,0,0,7);g.fill();
  g.strokeStyle=ac;g.lineWidth=3;g.beginPath();g.moveTo(10,0);g.lineTo(26,0);g.stroke();
  g.fillStyle='#ddd';g.beginPath();g.arc(1,0,7,0,7);g.fill();g.strokeStyle=hc;g.lineWidth=1.5;g.beginPath();g.moveTo(-5,0);g.lineTo(7,0);g.moveTo(1,-6);g.lineTo(1,6);g.stroke();
 }else{
  g.strokeStyle=jc;g.lineWidth=5;g.beginPath();g.moveTo(0,-10);g.lineTo(11,-3);g.moveTo(0,10);g.lineTo(9,5);g.stroke();
  g.strokeStyle='#8b5a2b';g.lineWidth=3;g.beginPath();g.moveTo(7,7);g.lineTo(29,-1);g.stroke();
  g.strokeStyle='#222';g.lineWidth=4;g.beginPath();g.moveTo(27,-1);g.lineTo(31,-3);g.stroke();
  g.fillStyle=jc;g.beginPath();g.ellipse(0,0,8,14,0,0,7);g.fill();
  g.fillStyle=ac;g.fillRect(-4,-14,3,28);
  g.fillStyle=hc;g.beginPath();g.arc(2,0,6.5,0,7);g.fill();
  g.fillStyle=ac;g.fillRect(-4,-1,12,2);
 }
 g.restore();
 if(p===ctl){g.strokeStyle='#e0b030';g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,(p.gl?19:17),0,7);g.stroke()}
}
function draw(){
 g.fillStyle='#eef6fb';g.fillRect(0,0,W,H);
 g.lineWidth=3;g.strokeStyle='#cc3344';g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.stroke();
 g.strokeStyle='#2a5bd7';[270,530].forEach(v=>{g.beginPath();g.moveTo(v,0);g.lineTo(v,H);g.stroke()});
 g.strokeStyle='#cc3344';g.beginPath();g.arc(W/2,GY,45,0,7);g.stroke();
 g.fillStyle='rgba(120,170,230,.35)';[[0,-Math.PI/2,Math.PI/2],[W,Math.PI/2,-Math.PI/2]].forEach(([x0,a,b])=>{g.beginPath();g.arc(x0,GY,42,a,b,x0>0);g.fill()});
 g.fillStyle='#7a1f2b';g.fillRect(0,GY-GH,10,GH*2);g.fillStyle='#444';g.fillRect(W-10,GY-GH,10,GH*2);
 for(const p of P)icon(p);
 if(hold&&car===ctl){g.fillStyle='#0003';g.fillRect(ctl.x-18,ctl.y-30,36,6);g.fillStyle='#e0b030';g.fillRect(ctl.x-18,ctl.y-30,36*Math.min(charge,1),6)}
 g.fillStyle='#111';g.beginPath();g.arc(puck.x,puck.y,5,0,7);g.fill();
 g.fillStyle='rgba(122,31,43,.92)';g.fillRect(W/2-170,0,340,30);
 g.fillStyle='#fff';g.font='bold 16px system-ui';g.textAlign='center';
 const t=ot?'OT':Math.floor(clock/60)+':'+String(Math.floor(clock%60)).padStart(2,'0');
 g.fillText('STUDENTS '+score[0]+'  \u2022  '+t+'  \u2022  '+score[1]+' FACULTY',W/2,21);
 if(pause>0){g.fillStyle='rgba(122,31,43,.85)';g.fillRect(0,GY-34,W,68);g.fillStyle='#e0b030';g.font='bold 36px system-ui';g.fillText(msg,W/2,GY+12)}
}
function loop(){if(play)step();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)press();return}if(e.key==='e'||e.key==='E'){doPass();return}keys[e.key.length>1?e.key:e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{if(e.code==='Space'){release();return}keys[e.key.length>1?e.key:e.key.toLowerCase()]=0});
const rel=e=>{const r=cv.getBoundingClientRect(),t=e.touches[0];return[(t.clientX-r.left)*W/r.width,(t.clientY-r.top)*H/r.height]};
cv.addEventListener('touchstart',e=>{e.preventDefault();org=rel(e)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(!org)return;const p=rel(e);tv=[cl((p[0]-org[0])/40,-1,1),cl((p[1]-org[1])/40,-1,1)]},{passive:false});
cv.addEventListener('touchend',()=>{org=null;tv=[0,0]});
const bs=$('bs');bs.addEventListener('pointerdown',e=>{e.preventDefault();press()});['pointerup','pointerleave','pointercancel'].forEach(n=>bs.addEventListener(n,release));
$('bp').addEventListener('pointerdown',e=>{e.preventDefault();doPass()});
$('go').onclick=()=>{score=[0,0];clock=90;ot=false;pause=0;pend=false;setup();$('ov').classList.add('hidden');play=true};
setup();loop();
</script>
</body>
</html>
