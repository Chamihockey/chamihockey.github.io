<style>
:root{--bg:#f4efe6;--fg:#2a1a1a;--accent:#7a1f2b;--gold:#e0b030;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1214;--fg:#f4e9e0;--accent:#c4475a;--card:#2a1d20}}

body{max-width:560px;margin:0 auto;padding:24px 16px}
h1{color:var(--accent);text-align:center;letter-spacing:.05em}

.difficulty label{display:block;font-weight:800;margin-bottom:8px;color:var(--accent)}
.difficulty select{width:100%;font:inherit;font-weight:700;padding:12px;border:2px solid var(--accent);border-radius:10px;background:var(--bg);color:var(--fg)}

</style>
</head>

</section>

</div>
<div id="gameView" style="display:none;position:fixed;inset:0;background:var(--bg)">

</div>
<script>
const GAME_PAGES = {"air": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Chami Hockey<\/title>\n<style>\n:root{--bg:#f4efe6;--fg:#2a1a1a;--accent:#7a1f2b;--gold:#e0b030;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#1a1214;--fg:#f4e9e0;--accent:#c4475a;--gold:#e0b030;--card:#2a1d20}}\n:root[data-theme=\"dark\"]{--bg:#1a1214;--fg:#f4e9e0;--accent:#c4475a;--gold:#e0b030;--card:#2a1d20}\nhtml,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,\"Segoe UI\",sans-serif}\nbody{display:flex;flex-direction:column;align-items:center;padding:12px;min-height:100vh}\nh1{margin:4px 0;font-size:1.5rem;color:var(--accent);letter-spacing:.04em}\n.sub{margin:0 0 8px;font-size:.85rem;opacity:.75}\n.wrap{position:relative;width:100%;max-width:360px}\ncanvas{width:100%;height:auto;display:block;border-radius:14px;border:4px solid var(--accent);touch-action:none;background:#eaf4fb}\n.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(40,10,15,.82);color:#fff;border-radius:10px;text-align:center;padding:20px}\n.ov h2{margin:0;color:var(--gold);font-size:1.6rem}\n.ov p{margin:0;font-size:.95rem}\nbutton{font:inherit;font-weight:700;padding:10px 24px;border:0;border-radius:999px;background:var(--gold);color:#3a1a00;cursor:pointer}\n.difficulty{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}\n.difficulty label{font-weight:800;color:var(--accent)}\n.difficulty select{font:inherit;font-weight:700;padding:8px 12px;border:2px solid var(--accent);border-radius:10px;background:var(--bg);color:var(--fg)}\n.hidden{display:none}\n<\/style>\n<\/head>\n<body>\n<h1>CHAMI HOCKEY<\/h1>\n<p class=\"sub\">Students vs. The Faculty &middot; first to 5 wins &middot; <a href=\"#\" onclick=\"parent.showMenu();return false\" style=\"color:var(--accent)\">All Chami games<\/a><\/p>\n<div class=\"difficulty\"><label for=\"difficulty\">DIFFICULTY<\/label><select id=\"difficulty\"><option value=\"easy\">Easy<\/option><option value=\"normal\">Normal<\/option><option value=\"hard\">Hard<\/option><\/select><\/div>\n<div class=\"wrap\">\n<canvas id=\"c\" width=\"360\" height=\"600\"><\/canvas>\n<div class=\"ov\" id=\"ov\">\n<h2 id=\"ovT\">Chami Hockey<\/h2>\n<p id=\"ovP\">Drag your mallet to hit the puck into the Faculty's goal. Keep it out of yours!<\/p>\n<button id=\"btn\">Drop the Puck<\/button>\n<\/div>\n<\/div>\n<script>\nconst cv=document.getElementById('c'),x=cv.getContext('2d');\nconst W=360,H=600,GW=120,WIN=5,PR=14,MR=26;\nconst ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovP=document.getElementById('ovP'),btn=document.getElementById('btn');\nlet s,running=false,pause=0,ptr={x:W/2,y:H-90};\nconst difficultySelect=document.getElementById('difficulty'),DIFFICULTIES={\n easy:{speed:2.8,track:0.22,aim:0.2},\n normal:{speed:4.2,track:0.4,aim:0},\n hard:{speed:5.2,track:0.62,aim:-0.08}\n};\nfunction readDifficulty(){try{const v=localStorage.getItem('chamiGamesDifficulty');return DIFFICULTIES[v]?v:'normal'}catch(e){return 'normal'}}\nfunction setDifficulty(v){if(!DIFFICULTIES[v])v='normal';difficultySelect.value=v;try{localStorage.setItem('chamiGamesDifficulty',v)}catch(e){}}\nsetDifficulty(readDifficulty());\ndifficultySelect.addEventListener('change',()=>setDifficulty(difficultySelect.value));\nconst diff=()=>DIFFICULTIES[difficultySelect.value]||DIFFICULTIES.normal;\nfunction mk(){return{x:W/2,y:H/2,vx:0,vy:0}}\nfunction reset(){s={puck:mk(),me:{x:W/2,y:H-90,vx:0,vy:0},ai:{x:W/2,y:90,vx:0,vy:0},sc:[0,0]}}\nfunction serve(dir){s.puck=mk();s.puck.vy=dir*3;pause=50}\nfunction pos(e){const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;ptr.x=(t.clientX-r.left)*W/r.width;ptr.y=(t.clientY-r.top)*H/r.height}\n['mousemove','touchmove','touchstart'].forEach(n=>cv.addEventListener(n,e=>{e.preventDefault();pos(e)},{passive:false}));\nfunction hit(p,m){\n const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy),min=PR+MR;\n if(d<min&&d>0){\n  const nx=dx/d,ny=dy/d;p.x=m.x+nx*min;p.y=m.y+ny*min;\n  const vn=(p.vx-m.vx)*nx+(p.vy-m.vy)*ny;\n  if(vn<0){p.vx-=2*vn*nx;p.vy-=2*vn*ny}\n  p.vx+=m.vx*.4;p.vy+=m.vy*.4;\n  const sp=Math.hypot(p.vx,p.vy);if(sp>13){p.vx*=13/sp;p.vy*=13/sp}\n }\n}\nfunction goal(who){\n s.sc[who]++;\n if(s.sc[who]>=WIN){running=false;ovT.textContent=who?'You win! \\u{1F3D2}':'Faculty wins!';ovP.textContent=who?'The Students take it '+s.sc[1]+'\\u2013'+s.sc[0]+'. Chami pride!':'Detention for the Students, '+s.sc[0]+'\\u2013'+s.sc[1]+'. Rematch?';btn.textContent='Play Again';ov.classList.remove('hidden')}\n else serve(who?-1:1);\n}\nfunction step(){\n const m=s.me,a=s.ai,p=s.puck;\n let tx=Math.min(W-MR,Math.max(MR,ptr.x)),ty=Math.min(H-MR,Math.max(H/2+MR,ptr.y));\n m.vx=tx-m.x;m.vy=ty-m.y;m.x=tx;m.y=ty;\n if(pause>0){pause--;return}\n let ax,ay;\n if(p.y<H/2+20){ax=p.x;ay=p.y-30}else{ax=W/2+(p.x-W/2)*.4;ay=80}\n const ds=Math.hypot(ax-a.x,ay-a.y),sp=Math.min(4.2,ds);\n a.vx=ds?(ax-a.x)/ds*sp:0;a.vy=ds?(ay-a.y)/ds*sp:0;\n a.x=Math.min(W-MR,Math.max(MR,a.x+a.vx));a.y=Math.min(H/2-MR,Math.max(MR,a.y+a.vy));\n p.x+=p.vx;p.y+=p.vy;p.vx*=.995;p.vy*=.995;\n hit(p,m);hit(p,a);\n if(p.x<PR){p.x=PR;p.vx=Math.abs(p.vx)}\n if(p.x>W-PR){p.x=W-PR;p.vx=-Math.abs(p.vx)}\n const inG=Math.abs(p.x-W/2)<GW/2;\n if(p.y<PR){if(inG&&p.y<-PR){goal(1);return}if(!inG){p.y=PR;p.vy=Math.abs(p.vy)}}\n if(p.y>H-PR){if(inG&&p.y>H+PR){goal(0);return}if(!inG){p.y=H-PR;p.vy=-Math.abs(p.vy)}}\n}\nfunction draw(){\n x.fillStyle='#eaf4fb';x.fillRect(0,0,W,H);\n x.strokeStyle='#7a1f2b';x.lineWidth=3;\n x.beginPath();x.moveTo(0,H/2);x.lineTo(W,H/2);x.stroke();\n x.beginPath();x.arc(W/2,H/2,50,0,7);x.stroke();\n x.fillStyle='#7a1f2b';x.beginPath();x.arc(W/2,H/2,5,0,7);x.fill();\n x.fillStyle='#e0b030';\n x.fillRect(W/2-GW/2,0,GW,6);x.fillRect(W/2-GW/2,H-6,GW,6);\n x.fillStyle='rgba(122,31,43,.18)';x.font='bold 64px system-ui';x.textAlign='center';\n x.fillText(s.sc[0],W/2,H/2-30);x.fillText(s.sc[1],W/2,H/2+80);\n x.font='bold 11px system-ui';x.fillText('THE FACULTY',W/2,H/2-8);x.fillText('STUDENTS',W/2,H/2+20);\n mallet(s.ai,'#444','#999');mallet(s.me,'#7a1f2b','#e0b030');\n const p=s.puck;x.fillStyle='#111';x.beginPath();x.arc(p.x,p.y,PR,0,7);x.fill();\n x.strokeStyle='#e0b030';x.lineWidth=2;x.beginPath();x.arc(p.x,p.y,PR-4,0,7);x.stroke();\n}\nfunction mallet(m,c1,c2){\n x.fillStyle=c1;x.beginPath();x.arc(m.x,m.y,MR,0,7);x.fill();\n x.fillStyle=c2;x.beginPath();x.arc(m.x,m.y,MR*.5,0,7);x.fill();\n}\nfunction loop(){if(running)step();draw();requestAnimationFrame(loop)}\nbtn.onclick=()=>{reset();ov.classList.add('hidden');running=true;serve(1)};\nreset();loop();\n<\/script>\n<\/body>\n<\/html>\n", "chel": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Chami Chel<\/title>\n<style>\n:root{--bg:#f4efe6;--fg:#2a1a1a;--accent:#7a1f2b;--gold:#e0b030;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#1a1214;--fg:#f4e9e0;--accent:#c4475a}}\n:root[data-theme=\"dark\"]{--bg:#1a1214;--fg:#f4e9e0;--accent:#c4475a}\nhtml,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,\"Segoe UI\",sans-serif}\nbody{display:flex;flex-direction:column;align-items:center;padding:10px;min-height:100vh}\nh1{margin:4px 0;font-size:1.5rem;color:var(--accent);letter-spacing:.04em}\na{color:var(--accent)}\n.sub{margin:0 0 8px;font-size:.85rem;opacity:.8;text-align:center}\n.wrap{position:relative;width:100%;max-width:820px}\ncanvas{width:100%;height:auto;display:block;border-radius:14px;border:4px solid var(--accent);touch-action:none;background:#eef6fb}\n.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(40,10,15,.85);color:#fff;border-radius:10px;text-align:center;padding:20px}\n.ov h2{margin:0;color:var(--gold);font-size:1.7rem}\n.ov p{margin:0;font-size:.95rem;max-width:460px}\nbutton{font:inherit;font-weight:700;padding:10px 24px;border:0;border-radius:999px;background:var(--gold);color:#3a1a00;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}\n.difficulty{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}\n.difficulty label{font-weight:800;color:var(--accent)}\n.difficulty select{font:inherit;font-weight:700;padding:8px 12px;border:2px solid var(--accent);border-radius:10px;background:var(--bg);color:var(--fg)}\n.pad{display:flex;gap:16px;margin-top:10px}\n.pad button{padding:16px 34px;font-size:1.05rem}\n.hidden{display:none}\n<\/style>\n<\/head>\n<body>\n<h1>CHAMI CHEL<\/h1>\n<p class=\"sub\">3-on-3 hockey &middot; Students vs. The Faculty &middot; <a href=\"#\" onclick=\"parent.showMenu();return false\">All Chami games<\/a><\/p>\n<div class=\"difficulty\"><label for=\"difficulty\">DIFFICULTY<\/label><select id=\"difficulty\"><option value=\"easy\">Easy<\/option><option value=\"normal\">Normal<\/option><option value=\"hard\">Hard<\/option><\/select><span class=\"sub\">Also available on the main menu<\/span><\/div>\n<div class=\"wrap\">\n<canvas id=\"c\" width=\"800\" height=\"440\"><\/canvas>\n<div class=\"ov\" id=\"ov\">\n<h2 id=\"ovT\">Chami Chel<\/h2>\n<p id=\"ovP\">Move: WASD / arrows (or drag on the left side on a phone).<br>Hold SPACE to charge a shot, release to fire. Press E to pass. 90 seconds, sudden-death overtime if tied.<\/p>\n<button id=\"go\">Face Off<\/button>\n<\/div>\n<\/div>\n<div class=\"pad\"><button id=\"bs\">SHOOT<\/button><button id=\"bp\">PASS<\/button><\/div>\n<script>\nconst W=800,H=440,GY=220,GH=58,cv=document.getElementById('c'),g=cv.getContext('2d'),$=id=>document.getElementById(id);\nlet P,puck,car,ctl,score=[0,0],clock=90,pause=0,pend=false,msg='',ot=false,play=false,keys={},tv=[0,0],charge=0,hold=false,org=null;\nconst difficultySelect=$('difficulty'),DIFFICULTIES={\n easy:{facultySpeed:1.9,facultyGoalieSpeed:1.25,facultyGoalieRange:23,facultySteal:.025,facultyAim:1.35,studentAssist:1.12},\n normal:{facultySpeed:2.4,facultyGoalieSpeed:1.7,facultyGoalieRange:26,facultySteal:.05,facultyAim:1,studentAssist:1},\n hard:{facultySpeed:3.0,facultyGoalieSpeed:2.25,facultyGoalieRange:31,facultySteal:.085,facultyAim:.72,studentAssist:.88}\n};\nfunction readDifficulty(){try{const v=localStorage.getItem('chamiGamesDifficulty');return DIFFICULTIES[v]?v:'normal'}catch(e){return 'normal'}}\nfunction setDifficulty(v){if(!DIFFICULTIES[v])v='normal';difficultySelect.value=v;try{localStorage.setItem('chamiGamesDifficulty',v)}catch(e){}}\nsetDifficulty(readDifficulty());\ndifficultySelect.addEventListener('change',()=>setDifficulty(difficultySelect.value));\nconst diff=()=>DIFFICULTIES[difficultySelect.value]||DIFFICULTIES.normal;\nconst dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),cl=(v,a,b)=>Math.max(a,Math.min(b,v));\nconst mk=(t,x,y,gl)=>({t,x,y,vx:0,vy:0,f:t?Math.PI:0,gl,cd:0,ai:50});\nfunction setup(){P=[mk(0,45,GY,1),mk(0,300,150),mk(0,300,290),mk(1,W-45,GY,1),mk(1,500,150),mk(1,500,290)];puck={x:W/2,y:GY,vx:0,vy:0};car=null;ctl=P[1];hold=false;charge=0}\nfunction shoot(p,sp,a=p.f){puck.x=p.x+Math.cos(a)*18;puck.y=p.y+Math.sin(a)*18;puck.vx=Math.cos(a)*sp;puck.vy=Math.sin(a)*sp;car=null;p.cd=25;p.f=a}\nfunction pass(p){let b=null,bs=-1e9;for(const q of P){if(q.t!==p.t||q.gl||q===p)continue;const a=Math.atan2(q.y-p.y,q.x-p.x),s=p===ctl?Math.cos(a-p.f)*100-dist(p,q)*.05:-dist(p,q);if(s>bs){bs=s;b=q}}if(b)shoot(p,9,Math.atan2(b.y+b.vy*8-p.y,b.x+b.vx*8-p.x))}\nfunction press(){hold=true;charge=0}\nfunction release(){if(hold&&car===ctl){let a=ctl.f;const d=Math.atan2(GY-ctl.y,W-ctl.x);let df=Math.atan2(Math.sin(d-a),Math.cos(d-a));if(Math.abs(df)<1.1)a+=df*.85;shoot(ctl,10+Math.min(charge,1)*6,a)}hold=false;charge=0}\nfunction doPass(){if(car===ctl)pass(ctl)}\nconst tw=(p,tx,ty)=>{const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);return d<6?[0,0]:[dx/d,dy/d]};\nfunction ai(p){const dir=p.t?-1:1,gx=p.t?0:W,own=p.t?W:0;\n if(car===p){p.ai--;const d=Math.hypot(gx-p.x,GY-p.y);\n  if(p.ai<=0&&d<240){const level=diff();shoot(p,9,Math.atan2(GY+(Math.random()-.5)*70*level.facultyAim-p.y,gx-p.x)+(Math.random()-.5)*.45*level.facultyAim);p.ai=60;return[0,0]}\n  if(p.ai<=0&&P.some(o=>o.t!==p.t&&!o.gl&&dist(o,p)<40)){pass(p);p.ai=40;return[0,0]}\n  return tw(p,gx,GY)}\n if(car&&car.t===p.t)return tw(p,cl(car.x+dir*110,60,W-60),H-car.y);\n let b=null,bd=1e9;for(const q of P)if(q.t===p.t&&!q.gl){const d=dist(q,puck);if(d<bd){bd=d;b=q}}\n if(b===p)return tw(p,puck.x,puck.y);\n return tw(p,puck.x*.6+own*.4,GY)}\nfunction goal(w){score[w]++;msg=w?'GOAL \\u2014 FACULTY!':'GOAL \\u2014 STUDENTS!';if(ot){end();return}pause=100;pend=true}\nfunction end(){play=false;const a=score[0],b=score[1];$('ovT').textContent=a>b?'Students win! \\ud83c\\udfd2':'The Faculty wins!';$('ovP').textContent='Final: Students '+a+', Faculty '+b+(a>b?'. Chami pride!':'. Rematch?');$('go').textContent='Play Again';$('ov').classList.remove('hidden')}\nfunction step(){\n if(pause>0){if(--pause===0&&pend){pend=false;setup()}return}\n clock-=1/60;if(clock<=0){clock=0;if(score[0]!==score[1]){end();return}ot=true}\n if(car&&car.t===0&&!car.gl)ctl=car;else{let b=null,bd=1e9;for(const p of P)if(p.t===0&&!p.gl){const d=dist(p,puck);if(d<bd){bd=d;b=p}}if(b!==ctl&&bd<dist(ctl,puck)-30)ctl=b}\n let ix=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+tv[0],iy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+tv[1];\n const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}\n if(hold)charge+=.025;\n for(const p of P){p.cd--;\n  if(p.gl){const hx=p.t?W-45:45;p.x=hx;const gs=p.t?diff().facultyGoalieSpeed:3,gr=p.t?diff().facultyGoalieRange:38;p.y=cl(p.y+cl(puck.y-p.y,-gs,gs),GY-gr,GY+gr);continue}\n  const [ax,ay]=p===ctl?[ix*diff().studentAssist,iy*diff().studentAssist]:ai(p),mx=p.t?diff().facultySpeed:3.6;\n  p.vx=p.vx*.88+ax*.5;p.vy=p.vy*.88+ay*.5;const s=Math.hypot(p.vx,p.vy);if(s>mx){p.vx*=mx/s;p.vy*=mx/s}\n  if(Math.hypot(ax,ay)>.1)p.f=Math.atan2(ay,ax);\n  p.x=cl(p.x+p.vx,14,W-14);p.y=cl(p.y+p.vy,14,H-14)}\n for(const p of P)if(!p.gl)for(const q of P)if(q.gl){const dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;if(d<36){p.x=q.x+dx/d*36;p.y=q.y+dy/d*36;p.vx*=.5;p.vy*=.5}}\n if(car){puck.x=car.x+Math.cos(car.f)*16;puck.y=car.y+Math.sin(car.f)*16;puck.vx=puck.vy=0;\n  for(const p of P)if(!p.gl&&p.t!==car.t&&p.cd<=0&&dist(p,car)<20&&Math.random()<(car.t===0?diff().facultySteal:.05)){car.cd=40;car=p;break}}\n else{\n  puck.x+=puck.vx;puck.y+=puck.vy;puck.vx*=.988;puck.vy*=.988;\n  const sp=Math.hypot(puck.vx,puck.vy);\n  for(const p of P){const d=dist(p,puck),r=p.gl?(p.t?12:18):13;if(d>=r+5)continue;\n   const nx=(puck.x-p.x)/(d||1),ny=(puck.y-p.y)/(d||1);\n   if(!p.gl&&p.cd<=0&&sp<11){car=p;puck.vx=puck.vy=0;break}\n   const vn=puck.vx*nx+puck.vy*ny;if(vn<0){puck.vx-=1.7*vn*nx;puck.vy-=1.7*vn*ny}\n   if(p.gl&&Math.hypot(puck.vx,puck.vy)<2.5){puck.vx+=nx*3;puck.vy+=ny*3}\n   puck.x=p.x+nx*(r+6);puck.y=p.y+ny*(r+6)}\n  if(!car){\n   if(Math.abs(puck.y-GY)<GH){if(puck.x<16){goal(1);return}if(puck.x>W-16){goal(0);return}}\n   if(puck.x<10){puck.x=10;puck.vx=Math.abs(puck.vx)*.9}\n   if(puck.x>W-10){puck.x=W-10;puck.vx=-Math.abs(puck.vx)*.9}\n   if(puck.y<8){puck.y=8;puck.vy=Math.abs(puck.vy)*.9}\n   if(puck.y>H-8){puck.y=H-8;puck.vy=-Math.abs(puck.vy)*.9}}}\n}\nfunction icon(p){\n const S=p.t===0,jc=S?'#7a1f2b':'#3a3a3a',ac=S?'#e0b030':'#cfcfcf',hc=S?'#4a0f18':'#111';\n g.save();g.translate(p.x,p.y);g.rotate(p.f);g.lineCap='round';\n if(p.gl){\n  g.fillStyle='#fff';g.strokeStyle=jc;g.lineWidth=2;\n  g.fillRect(2,-17,13,10);g.strokeRect(2,-17,13,10);g.fillRect(2,7,13,10);g.strokeRect(2,7,13,10);\n  g.fillStyle=jc;g.beginPath();g.ellipse(-2,0,9,15,0,0,7);g.fill();\n  g.strokeStyle=ac;g.lineWidth=3;g.beginPath();g.moveTo(10,0);g.lineTo(26,0);g.stroke();\n  g.fillStyle='#ddd';g.beginPath();g.arc(1,0,7,0,7);g.fill();g.strokeStyle=hc;g.lineWidth=1.5;g.beginPath();g.moveTo(-5,0);g.lineTo(7,0);g.moveTo(1,-6);g.lineTo(1,6);g.stroke();\n }else{\n  g.strokeStyle=jc;g.lineWidth=5;g.beginPath();g.moveTo(0,-10);g.lineTo(11,-3);g.moveTo(0,10);g.lineTo(9,5);g.stroke();\n  g.strokeStyle='#8b5a2b';g.lineWidth=3;g.beginPath();g.moveTo(7,7);g.lineTo(29,-1);g.stroke();\n  g.strokeStyle='#222';g.lineWidth=4;g.beginPath();g.moveTo(27,-1);g.lineTo(31,-3);g.stroke();\n  g.fillStyle=jc;g.beginPath();g.ellipse(0,0,8,14,0,0,7);g.fill();\n  g.fillStyle=ac;g.fillRect(-4,-14,3,28);\n  g.fillStyle=hc;g.beginPath();g.arc(2,0,6.5,0,7);g.fill();\n  g.fillStyle=ac;g.fillRect(-4,-1,12,2);\n }\n g.restore();\n if(p===ctl){g.strokeStyle='#e0b030';g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,(p.gl?19:17),0,7);g.stroke()}\n}\nfunction draw(){\n g.fillStyle='#eef6fb';g.fillRect(0,0,W,H);\n g.lineWidth=3;g.strokeStyle='#cc3344';g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.stroke();\n g.strokeStyle='#2a5bd7';[270,530].forEach(v=>{g.beginPath();g.moveTo(v,0);g.lineTo(v,H);g.stroke()});\n g.strokeStyle='#cc3344';g.beginPath();g.arc(W/2,GY,45,0,7);g.stroke();\n g.fillStyle='rgba(120,170,230,.35)';[[0,-Math.PI/2,Math.PI/2],[W,Math.PI/2,-Math.PI/2]].forEach(([x0,a,b])=>{g.beginPath();g.arc(x0,GY,42,a,b,x0>0);g.fill()});\n g.fillStyle='#7a1f2b';g.fillRect(0,GY-GH,10,GH*2);g.fillStyle='#444';g.fillRect(W-10,GY-GH,10,GH*2);\n for(const p of P)icon(p);\n if(hold&&car===ctl){g.fillStyle='#0003';g.fillRect(ctl.x-18,ctl.y-30,36,6);g.fillStyle='#e0b030';g.fillRect(ctl.x-18,ctl.y-30,36*Math.min(charge,1),6)}\n g.fillStyle='#111';g.beginPath();g.arc(puck.x,puck.y,5,0,7);g.fill();\n g.fillStyle='rgba(122,31,43,.92)';g.fillRect(W/2-170,0,340,30);\n g.fillStyle='#fff';g.font='bold 16px system-ui';g.textAlign='center';\n const t=ot?'OT':Math.floor(clock/60)+':'+String(Math.floor(clock%60)).padStart(2,'0');\n g.fillText('STUDENTS '+score[0]+'  \\u2022  '+t+'  \\u2022  '+score[1]+' FACULTY',W/2,21);\n if(pause>0){g.fillStyle='rgba(122,31,43,.85)';g.fillRect(0,GY-34,W,68);g.fillStyle='#e0b030';g.font='bold 36px system-ui';g.fillText(msg,W/2,GY+12)}\n}\nfunction loop(){if(play)step();draw();requestAnimationFrame(loop)}\naddEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)press();return}if(e.key==='e'||e.key==='E'){doPass();return}keys[e.key.length>1?e.key:e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});\naddEventListener('keyup',e=>{if(e.code==='Space'){release();return}keys[e.key.length>1?e.key:e.key.toLowerCase()]=0});\nconst rel=e=>{const r=cv.getBoundingClientRect(),t=e.touches[0];return[(t.clientX-r.left)*W/r.width,(t.clientY-r.top)*H/r.height]};\ncv.addEventListener('touchstart',e=>{e.preventDefault();org=rel(e)},{passive:false});\ncv.addEventListener('touchmove',e=>{e.preventDefault();if(!org)return;const p=rel(e);tv=[cl((p[0]-org[0])/40,-1,1),cl((p[1]-org[1])/40,-1,1)]},{passive:false});\ncv.addEventListener('touchend',()=>{org=null;tv=[0,0]});\nconst bs=$('bs');bs.addEventListener('pointerdown',e=>{e.preventDefault();press()});['pointerup','pointerleave','pointercancel'].forEach(n=>bs.addEventListener(n,release));\n$('bp').addEventListener('pointerdown',e=>{e.preventDefault();doPass()});\n$('go').onclick=()=>{score=[0,0];clock=90;ot=false;pause=0;pend=false;setup();$('ov').classList.add('hidden');play=true};\nsetup();loop();\n<\/script>\n<\/body>\n<\/html>\n"};
