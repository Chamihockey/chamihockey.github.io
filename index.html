<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chami Games</title>
<style>
:root{--bg:#f4efe6;--fg:#2a1a1a;--accent:#7a1f2b;--gold:#e0b030;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1214;--fg:#f4e9e0;--accent:#c4475a;--card:#2a1d20}}
:root[data-theme="dark"]{--bg:#1a1214;--fg:#f4e9e0;--accent:#c4475a;--card:#2a1d20}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{max-width:560px;margin:0 auto;padding:24px 16px}
h1{color:var(--accent);text-align:center;letter-spacing:.05em}
p.lead{text-align:center;opacity:.8}
a.card{display:block;background:var(--card);border:3px solid var(--accent);border-radius:14px;padding:16px 18px;margin:14px 0;text-decoration:none;color:var(--fg)}
a.card b{display:block;font-size:1.2rem;color:var(--accent)}
a.card:hover{border-color:var(--gold)}
</style>
</head>
<body>
<h1>CHAMI GAMES</h1>
<p class="lead">Made by students, for Chaminade.</p>
